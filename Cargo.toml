[workspace]
resolver = "2"
members = ["crates/celaut-proto", "crates/service-library"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# bee-rpc is GPL-3.0-only, and so is this library.
license = "GPL-3.0-only"

[workspace.dependencies]
celaut-proto = { path = "crates/celaut-proto" }
# A git dependency on the commit of bee-rpc 0.4.0 (`store`), until it has a tag.
bee-rpc = { git = "https://github.com/bee-rpc-protocol/bee-rpc-over-grpc-rs", rev = "3bbec87688542f164cd89f0df1446eb4282b1cb1", features = ["grpc"] }
