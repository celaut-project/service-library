[package]
name = "service-library"
description = "The library of a Celaut service: talk to the node of the service, and keep the instances of its dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bee-rpc = { workspace = true }
celaut-proto = { workspace = true }
prost = "0.14"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
blake2 = "0.11"
ring = "0.17"
hex = "0.4"
tokio-stream = { version = "0.1", default-features = false }
tokio = { version = "1.54", features = ["rt", "time", "sync", "macros", "net", "io-util", "fs"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tonic-prost = { version = "0.14", default-features = false }

[features]
# `https://` for the skills registry (the public Explorer is https only). Off, the library
# speaks plain HTTP only and the static `celaut` binary stays smaller.
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]

[dev-dependencies]
libc = "0.2"
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tokio = { version = "1.54", features = ["rt", "time", "sync", "macros", "test-util", "net", "io-util", "rt-multi-thread"] }
